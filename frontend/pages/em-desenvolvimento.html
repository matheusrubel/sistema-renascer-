<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#332652" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Em desenvolvimento | Sistema Renascer</title>
    <style>
      :root{font-family:Arial,sans-serif;color:#263f32;background:#f8f7fa;font-synthesis:none;text-rendering:optimizeLegibility;--roxo:#332652;--texto-suave:#738078;--borda:#e5e9e2}
      *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
      main{width:min(560px,100%);padding:48px 38px;background:#fff;border:1px solid var(--borda);border-radius:10px;text-align:center;box-shadow:0 16px 45px rgba(31,54,42,.09)}
      .brand{display:inline-flex;align-items:center;justify-content:center;margin-bottom:30px;text-decoration:none}
      .brand img{display:block;width:108px;height:106px;object-fit:contain}
      .eyebrow{margin:0 0 10px;color:#2b6038;font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase}
      h1{margin:0 0 12px;color:var(--roxo);font-size:30px}p{margin:0 auto;color:var(--texto-suave);font-size:15px;line-height:1.6;max-width:390px}
      .back{display:inline-flex;margin-top:30px;padding:12px 17px;border-radius:5px;background:var(--roxo);color:#fff;text-decoration:none;font-size:14px;font-weight:700}.back:hover{background:#241a3d}
      @media(max-width:480px){main{padding:38px 22px}h1{font-size:25px}}
    </style>
  </head>
  <body>
    <main>
      <a class="brand" href="/" aria-label="Sistema Renascer, voltar ao cadastro"><img src="/assets/logo-renascer.png" alt="Instituto de Ação Social Renascer" /></a>
      <p class="eyebrow" id="module-name">Módulo</p>
      <h1>Em desenvolvimento</h1>
      <p>Esta página fará parte do Sistema Renascer e será disponibilizada quando este módulo estiver pronto.</p>
      <a class="back" href="/">Voltar ao cadastro</a>
    </main>
    <script>
      const modulos = {
        atendimentos: "Atendimentos",
        atividades: "Atividades e turmas",
        relatorios: "Relatórios",
      };
      const chaveDoModulo = new URLSearchParams(window.location.search).get("modulo");
      const nomeDoModulo = modulos[chaveDoModulo] ?? "Módulo";
      document.getElementById("module-name").textContent = nomeDoModulo;
      document.title = `${nomeDoModulo} | Em desenvolvimento | Sistema Renascer`;
    </script>
  </body>
</html>
