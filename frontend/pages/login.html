<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#332652" />
    <title>Entrar | Sistema Renascer</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <link rel="stylesheet" href="/src/auth.css" />
  </head>
  <body class="auth-page">
    <main class="auth-shell">
      <section class="auth-aside">
        <img class="auth-full-image" src="/assets/images/identidade-renascer.jpeg" alt="Instituto de Ação Social Renascer, com a marca centralizada sobre a imagem das crianças atendidas." />
      </section>
      <section class="auth-panel">
        <form class="auth-card" id="login-form">
          <span class="auth-eyebrow">BEM-VINDA(O) DE VOLTA</span>
          <h2>Entrar</h2>
          <p class="auth-intro">Informe seu e-mail institucional e sua senha.</p>
          <label class="auth-field"><span>E-mail</span><input name="email" type="email" autocomplete="username" required placeholder="voce@instituto.org.br" /></label>
          <label class="auth-field"><span>Senha</span><input name="password" type="password" autocomplete="current-password" required minlength="8" placeholder="Sua senha" /></label>
          <a class="auth-forgot" href="#recuperar-senha" id="forgot-password">Esqueci minha senha</a>
          <button class="auth-submit" type="submit">Entrar</button>
          <p class="auth-message" id="auth-message" role="status" aria-live="polite" hidden></p>
          <p class="auth-switch">Precisa de acesso? <a href="/cadastro-usuario.html">Solicitar cadastro de usuário</a></p>
        </form>
      </section>
    </main>
    <script type="module" src="/src/auth.js"></script>
  </body>
</html>
