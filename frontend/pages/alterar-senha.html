<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#332652" />
    <title>Alterar senha | Sistema Renascer</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <link rel="stylesheet" href="/src/auth.css" />
  </head>
  <body class="auth-page">
    <main class="auth-shell">
      <section class="auth-aside">
        <img class="auth-full-image" src="/assets/images/identidade-renascer.jpeg" alt="Instituto de Ação Social Renascer, com a marca centralizada sobre a imagem das crianças atendidas." />
      </section>
      <section class="auth-panel">
        <form class="auth-card" id="password-form">
          <a class="auth-back" href="/login.html">← Voltar ao login</a>
          <span class="auth-eyebrow">SEGURANÇA DA CONTA</span>
          <h2>Alterar senha</h2>
          <p class="auth-intro" id="password-intro">Escolha uma nova senha para acessar o sistema.</p>
          <label class="auth-field"><span>Nova senha</span><input name="password" type="password" autocomplete="new-password" required minlength="8" placeholder="Mínimo de 8 caracteres" /></label>
          <label class="auth-field"><span>Confirmar nova senha</span><input name="confirmPassword" type="password" autocomplete="new-password" required minlength="8" placeholder="Digite novamente" /></label>
          <button class="auth-submit" type="submit">Salvar nova senha</button>
          <p class="auth-message" id="auth-message" role="status" aria-live="polite" hidden></p>
        </form>
      </section>
    </main>
    <script type="module" src="/src/password.js"></script>
  </body>
</html>
